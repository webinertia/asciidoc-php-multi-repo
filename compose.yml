# ---------------------------------------------------------------------------
# Webware alignment local development environment
#
# A persistent, interactive development environment that runs the full Webware
# toolchain (Composer, PHPUnit, Mago, Infection, PHPBench, roave BC-check)
# inside a container, so the host never needs a native PHP install. Works
# identically on Windows, WSL, Linux, and macOS.
#
# This compose file is the single source of truth for the environment. Two
# ways to use it:
#
#   1. VS Code Dev Container: "Reopen in Container" uses
#      .devcontainer/devcontainer.json, which is *backed by* this file (it
#      references the `tooling` service rather than defining its own).
#
#   2. Plain Docker Compose (any editor / no VS Code):
#        docker compose up -d                 # start the persistent container
#        docker compose exec tooling bash     # attach an interactive shell
#        docker compose exec tooling composer install
#        docker compose exec tooling composer test
#        docker compose exec tooling mago lint
#        docker compose down                  # stop it
#
#   3. The documentation site stack (the `site` profile):
#        docker compose run --rm render       # render once, exit with the build's code
#        docker compose up watch              # rebuild on change, serve on :8080
#        docker compose up preview            # serve an already built tree on :8080
#
#      All three live in the `site` profile, so a bare `docker compose up -d`
#      still starts only `tooling`. Naming one of them on the command line
#      enables the profile for that command, which is why the invocations above
#      work without --profile.
#
# Packages whose tests need MySQL uncomment the `mysql` service below (and the
# `phpmyadmin` web UI if wanted), plus the `depends_on` block on `tooling`. The
# `mysql` service mirrors the `db_image` package parameter used by CI, and is
# reachable from `tooling` as host `mysql` on port 3306: matching the PhpDb
# `mysql.local.php` connection convention. Packages that need a different
# engine add an equivalent service here (postgres, mariadb, ...) mirroring
# their own `db_image` parameter.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# The documentation site stack.
#
# These three services run the package's own console binary in the runtime
# image built by docker/Dockerfile, which is a different image from the
# `tooling` service above: that one is the interactive development toolchain,
# this one is the small non-root image a publish workflow can run.
#
# `render` runs the CLI's `build` once and exits with the build's exit code.
# `watch` rebuilds the affected projects as their sources change and serves
# the result. `preview` serves a tree that is already built. Only `watch` and
# `preview` publish a port, and only on the loopback interface.
#
# SITE_DIR is the directory holding the site's site.json; the config's
# output.directory is resolved against it. OUTPUT_DIR is the host directory
# that receives the rendered site and OUTPUT_PATH is where it is mounted
# inside the container, so the two have to agree with the config. The
# defaults match the bundled fixture site:
#
#   SITE_DIR=./test/fixtures SITE_MANIFEST=manifest.json \
#       docker compose run --rm render
#   SITE_DIR=./test/fixtures SITE_MANIFEST=manifest.json \
#       docker compose up watch
#
# SITE_DIR has to start with `.` or `/`: a bare relative path such as
# `test/fixtures` is read as a named volume, not a host directory. SITE_MANIFEST
# is a manifest read instead of the hosted API, which is what makes the fixture
# site renderable without a token.
#
# Note that the commented-out phpMyAdmin service above also claims port 8080;
# uncommenting it and running `watch` or `preview` at the same time needs
# SITE_PORT set to something else.
# ---------------------------------------------------------------------------
x-site-stack: &site-stack
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      # The package supports ~8.4 and ~8.5. The image is built on the floor
      # of that range, so the container proves the lowest supported runtime.
      PHP_VERSION: "8.4"
  image: asciidoc-php-multi-repo:local
  # The runtime image runs as root so it can also serve as the GitHub container
  # action, whose mounted workspace belongs to the runner's uid. Local
  # rendering does not need that, so these services keep the unprivileged
  # `site` account the image creates.
  user: "1000:1000"
  working_dir: /site
  # A PID 1 that reaps children, so a stopped watch loop leaves nothing behind.
  init: true
  stdin_open: true
  tty: true
  environment:
    # A container cannot be reached through 127.0.0.1, so the served
    # commands bind every interface and the published port is what limits
    # reachability.
    ASCIIDOC_SERVE_HOST: 0.0.0.0
    # Discovery token for the hosted documentation API, when one is needed.
    DOC_DISCOVERY_TOKEN: ${DOC_DISCOVERY_TOKEN:-}
    # A manifest read instead of the organization, for offline and CI runs.
    # The entrypoint turns it into --manifest for `render` and `watch`.
    ASCIIDOC_MANIFEST: ${SITE_MANIFEST:-}
  volumes:
    - ${SITE_DIR:-.}:/site
    - ${OUTPUT_DIR:-./build/site}:${OUTPUT_PATH:-/site/build/site}

services:
  tooling:
    build:
      context: .
      args:
        # PHP version to base the image on (latest 8.5 patch release). Keep
        # in sync with the package's supported PHP versions and
        # `config.platform.php`.
        PHP_VERSION: "8.5.12"
    # Keep the container alive so `docker compose exec` can attach to it.
    # (VS Code Dev Containers override this with their own command.)
    command: sleep infinity
    stdin_open: true
    tty: true
    environment:
      # Point Composer at the named volume so its cache and global config
      # survive container rebuilds (and live on the fast Linux filesystem).
      COMPOSER_HOME: /tmp/composer-cache
      # Uncomment (or export in your shell) to enable step debugging:
      # XDEBUG_MODE: debug
    extra_hosts:
      # Lets Xdebug connect back to the host IDE from Windows, macOS, or Linux
      # (host-gateway resolves to the Docker host on every platform).
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount the source so edits are visible on both the host and the
      # container. vendor/ is NOT overridden - it is the host's own copy.
      # Composer/installs inside the container write straight into the
      # developer's working tree on disk.
      - .:/app
      # The Composer cache lives in a named volume (Linux-native I/O, fast on
      # Windows) so downloads survive container rebuilds. It is only a cache
      # - the developer's real artifacts all live on the host.
      - composer-cache:/tmp/composer-cache
    # Uncomment when the package's tests need MySQL (see the `mysql` service
    # below). Ensures the database is ready before the shell attaches.
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    working_dir: /app

  # -------------------------------------------------------------------------
  # Documentation site stack. See the `x-site-stack` anchor above for the
  # mounts and the environment, and the header for the invocations.
  # -------------------------------------------------------------------------
  render:
    <<: *site-stack
    profiles: ["site"]
    command: ["render", "--config", "${SITE_CONFIG:-site.json}"]

  watch:
    <<: *site-stack
    profiles: ["site"]
    command: ["watch", "--config", "${SITE_CONFIG:-site.json}", "--port", "8080"]
    ports:
      - "127.0.0.1:${SITE_PORT:-8080}:8080"

  preview:
    <<: *site-stack
    profiles: ["site"]
    command: ["serve", "--config", "${SITE_CONFIG:-site.json}", "--out", "${OUTPUT_PATH:-/site/build/site}", "--port", "8080"]
    ports:
      - "127.0.0.1:${SITE_PORT:-8080}:8080"

  # -------------------------------------------------------------------------
  # MySQL (optional) - uncomment this whole block for packages whose tests
  # need a MySQL database (e.g. webware-acl via php-db/phpdb-mysql).
  #
  # Mirror the spec's `db_image` / `db_env_json` / `db_port` Package Parameters
  # so the dev database matches CI. Point the package's local DB config (e.g.
  # config/autoload/mysql.local.php) at host `mysql`, port 3306, using the
  # credentials below. Adjust MYSQL_DATABASE / MYSQL_USER / MYSQL_PASSWORD to
  # the package's test-database convention. MYSQL_ALLOW_EMPTY_PASSWORD keeps
  # the test-only database free of a root password and in sync with the CI
  # `db_env_json` - remove it if the package pins a root password instead.
  # -------------------------------------------------------------------------
  # mysql:
  #   image: mysql:9.7.4
  #   environment:
  #     MYSQL_ROOT_HOST: "%"
  #     MYSQL_ALLOW_EMPTY_PASSWORD: "true"
  #     MYSQL_DATABASE: webware
  #     MYSQL_USER: webware
  #     MYSQL_PASSWORD: webware
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 30
  #   volumes:
  #     # Named volume keeps the data on the fast Linux filesystem and
  #     # survives `docker compose down` (use `down -v` to wipe it).
  #     - mysql-data:/var/lib/mysql
  #
  # # phpMyAdmin - optional web UI for the `mysql` service above. Reachable at
  # # http://localhost:8080 (log in as root with an empty password, or with
  # # the MYSQL_USER / MYSQL_PASSWORD credentials). Uncomment alongside
  # # `mysql`.
  # phpmyadmin:
  #   image: phpmyadmin:5.2.3
  #   environment:
  #     PMA_HOST: mysql
  #     PMA_PORT: 3306
  #     PMA_USER: root
  #     PMA_PASSWORD: ""
  #   ports:
  #     - "127.0.0.1:8080:80"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy

volumes:
  composer-cache:
  # Used by the optional `mysql` service above.
  mysql-data:
